<title>Mental Health Predictor</title>
<meta name="description" content="Predict a mental health score from your daily habits with a trained machine learning model. An estimate, not a diagnosis." />
<meta name="color-scheme" content="light dark" />
<script>
  // Before first paint so a saved theme never flashes the wrong colours
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch {}
    const root = document.documentElement;
    if (saved === "light" || saved === "dark") root.dataset.theme = saved;
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.resolvedTheme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
  })();
</script>
